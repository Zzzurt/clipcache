name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rustfmt and clippy are hard failures so formatting and lint drift shows
      # up in the PR that introduces it rather than accumulating.
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Unit tests only. The two tests that write to the real system clipboard
      # are #[ignore]d, so they are skipped by default and this stays safe on a
      # headless runner.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          RUST_BACKTRACE: 1
