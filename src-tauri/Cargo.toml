[package]
name = "clipcache"
version = "0.2.0"
description = "A clean, elegant Windows clipboard manager"
authors = ["ClipCache"]
edition = "2021"

[lib]
name = "clipcache_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
base64 = "0.22"
